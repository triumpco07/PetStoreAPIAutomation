#Swagger URI --> https://petstore.swagger.io

#Create user(Post) : https://petstore.swagger.io/v2/user
#Get user (Get) : https://petstore.swagger.io/v2/user/{username}
#Update user (Put) : https://petstore.swagger.io/v2/user/{username}
#Delete user (Delete) : https://petstore.swagger.io/v2/user/{username}

#User Model
post_url=https://petstore.swagger.io/v2/user
get_url=https://petstore.swagger.io/v2/user/{username}
update_url=https://petstore.swagger.io/v2/user/{username}
delete_url=https://petstore.swagger.io/v2/user/{username}
login_url=https://petstore.swagger.io/v2/user/login
logout_url=https://petstore.swagger.io/v2/user/logout

#Store Model
#Here you can add Store url's
get_inventory_by_status_url=https://petstore.swagger.io/v2/store/inventory
place_order_url=https://petstore.swagger.io/v2/store/order
get_order_by_id_url= https://petstore.swagger.io/v2/store/order/{orderId}


#Pet Model
#Here you can add Pet url's
add_pet_url=https://petstore.swagger.io/v2/pet
find_pets_by_status_url=https://petstore.swagger.io/v2/pet/findByStatus
